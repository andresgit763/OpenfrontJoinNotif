# Publish a lobby decoder for every OpenFront production build.
#
# OpenFront's lobby feed is positional zbin with no version byte, so each
# deploy can change the wire layout. Production deploys are recorded in the
# public GitHub deployments API of openfrontio/OpenFrontIO (environments
# prod-blue / prod-green, with the exact commit), so this job polls that,
# builds decoders/<commit>.js for any build it has not seen, and commits it.
# The app downloads the file matching the server it connects to, so a deploy
# no longer needs a manual re-pin and reinstall.
name: Lobby decoders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lobby-decoders
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Find deployed OpenFront builds
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for env in prod-blue prod-green; do
            gh api "repos/openfrontio/OpenFrontIO/deployments?environment=$env&per_page=15" \
              --jq '.[] | .created_at + " " + .sha + " " + .ref'
          done | sort -r | awk '!seen[$2]++ { print $2, $3 }' > "$RUNNER_TEMP/deployed.txt"
          if [ ! -s "$RUNNER_TEMP/deployed.txt" ]; then
            echo "No deployments returned; nothing to do."
            echo "missing=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/deployed.txt"
          missing=""
          while read -r sha ref; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [ -f "decoders/$sha.js" ] || missing="$missing $sha"
          done < <(head -n 3 "$RUNNER_TEMP/deployed.txt")
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.find.outputs.missing != ''
        with:
          node-version: 24

      - name: Build missing decoders
        if: steps.find.outputs.missing != ''
        env:
          MISSING: ${{ steps.find.outputs.missing }}
          npm_config_engine_strict: "false"
        run: |
          set -euo pipefail
          for sha in $MISSING; do
            src="$RUNNER_TEMP/openfront-$sha"
            git init -q "$src"
            git -C "$src" remote add origin https://github.com/openfrontio/OpenFrontIO.git
            # The decoder only needs the npm workspaces, the root manifests
            # and one JSON file; skipping resources/ avoids ~800 MB of maps.
            git -C "$src" sparse-checkout set --no-cone \
              '/*' '!/*/' '/packages/' '/resources/QuickChat.json'
            git -C "$src" fetch -q --depth 1 --filter=blob:none origin "$sha"
            git -C "$src" checkout -q FETCH_HEAD
            (cd "$src" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
            node scripts/build-lobby-decoder.mjs "$src" "$sha" "decoders/$sha.js"
            rm -rf "$src"
          done

      - name: Prune and commit
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/deployed.txt" ] || exit 0
          # Keep decoders for the ten most recent production builds.
          head -n 10 "$RUNNER_TEMP/deployed.txt" | cut -d' ' -f1 > "$RUNNER_TEMP/keep.txt"
          shopt -s nullglob
          for f in decoders/*.js; do
            grep -qx "$(basename "$f" .js)" "$RUNNER_TEMP/keep.txt" || git rm -q "$f"
          done
          git add decoders
          if git diff --cached --quiet; then
            echo "Decoders already up to date."
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- decoders | xargs -r -n1 basename | sed 's/\.js$//')
          refs=$(for sha in $added; do awk -v s="$sha" '$1 == s { print $2 " (" substr(s, 1, 8) ")" }' "$RUNNER_TEMP/deployed.txt"; done | paste -sd, - | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publish lobby decoder for OpenFront ${refs:-builds}"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
